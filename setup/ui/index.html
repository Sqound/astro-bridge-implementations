<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Astro Bridge Setup</title>
  <link rel="stylesheet" href="setup.css">
  <script src="locales.js" defer></script>
  <script src="setup.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand">
        <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#25231a" stroke="#5b4a31"/>
          <g transform="rotate(22 24 24)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M28 14a11 11 0 0 1 6 6m0 8a11 11 0 0 1-6 6m-8 0a11 11 0 0 1-6-6m0-8a11 11 0 0 1 6-6"/>
            <path d="M24 9c.3 12 3 15 15 15-12 .3-15 3-15 15-.3-12-3-15-15-15 12-.3 15-3 15-15Z" fill="currentColor" stroke="none"/>
          </g>
        </svg>
        <div><strong>Astro Bridge</strong><span id="brand-label"></span></div>
      </div>
      <div class="header-tools">
        <span id="mode-badge" class="pill mode-badge"></span>
        <div class="locale-control">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
          <label class="sr-only" id="language-label" for="language"></label>
          <select id="language"></select>
        </div>
      </div>
    </header>
    <p id="preview-note" class="preview-note" hidden></p>
    <main id="main"></main>
  </div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="erase-dialog" aria-labelledby="erase-heading" aria-describedby="erase-description"></dialog>
</body>
</html>
